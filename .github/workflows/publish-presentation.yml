name: Restore approved DataTalk presentation
on:
  push:
    branches: [main]
    paths: ['.deploy/presentation.part*']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify original HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib
          parts = sorted(Path('.deploy').glob('presentation.part*'))
          assert len(parts) == 25, 'Incomplete upload'
          original = gzip.decompress(b''.join(p.read_bytes() for p in parts))
          assert len(original) == 9461606
          assert hashlib.sha256(original).hexdigest() == 'd15c67f7d35f1296e9283c2dd2709419b9f7db9ec61c787805d1a3ee8a59619c', 'Source mismatch'
          Path('index.html').write_bytes(original)
          PY
      - name: Commit verified presentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish exact approved DataTalk presentation'
          git push origin HEAD:main
